<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,4), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=2.2;return x<=0?0:1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x, CX=540, CY=960;
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
function set(el,{x=0,y=0,s=1,rx=0,ry=0,rz=0,o=1,bl=0}){
  el.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
  el.style.opacity=o; el.style.filter=bl>0.05?`blur(${bl}px)`:'none'; el.style.visibility=o<=0.002?'hidden':'visible';}
function life(t,a,b,ai=.5,bo=.4){return {i:eo(p(t,a,a+ai)),o:ei(p(t,b-bo,b)),on:t>a-.01&&t<b+.01}}
function std(el,t,a,b,{x=0,y=0,dy=70,s0=.85,bl0=14,dyo=-50,so=1,rz=0,ry=0}={}){const L=life(t,a,b);
  set(el,{x,y:y+(1-L.i)*dy+L.o*dyo,s:lerp(s0,1,L.i)*lerp(1,so,L.o),rz,ry,o:L.on?L.i*(1-L.o):0,bl:(1-L.i)*bl0+L.o*bl0});return L}
function pop(el,t,a,b,{x=0,y=0,rz=0,ry=0,rx=0,s=1}={}){const L=life(t,a,b,.45,.35);set(el,{x,y:y+L.o*-40,s:s*cl(back(p(t,a,a+.45)),0,2)*(1-L.o*.15),rz,ry,rx,o:L.on?cl(p(t,a,a+.12))*(1-L.o):0,bl:L.o*14});return L}
// 3D flip-in like the reference pills
function flip(el,t,a,b,{x=0,y=0,rz=0}={}){const L=life(t,a,b,.55,.35);set(el,{x:x+L.o*-300,y,rx:(1-L.i)*-90,rz:rz*L.i,s:lerp(.7,1,L.i),o:L.on?cl(L.i*2)*(1-L.o):0,bl:L.o*16});return L}

function draw(cv,k,lt,zoom=1){const a=IMG[k],n=a.length,f=Math.floor(lt*30)%(2*n-2),i=f<n?f:2*n-2-f,im=a[cl(i,0,n-1)],c=cv.getContext('2d'),w=cv.width,h=cv.height,s=Math.max(w/1280,h/720)*zoom;c.drawImage(im,(w-1280*s)/2,(h-720*s)/2,1280*s,720*s)}
function vcard(w,h){const e=H(`<div class="abs vid" style="width:${w}px;height:${h}px"></div>`);const c=document.createElement('canvas');c.width=w;c.height=h;e.appendChild(c);return {e,c}}

// rings (concentric + watermark word)

$('L_foot').insertAdjacentHTML('beforeend','<div class="full" style="background:linear-gradient(180deg,rgba(5,20,50,.55),rgba(5,20,50,.05) 35%,rgba(5,20,50,.1) 60%,rgba(5,20,50,.7))"></div>');

/* ---------- S2 map ---------- */
const map=H(`<div class="abs gl g-white" style="width:920px;height:800px;border-radius:56px;overflow:hidden">
<svg viewBox="0 0 920 800" width="920" height="800" style="position:absolute;left:0;top:0">
 <rect width="920" height="800" fill="#eef4ea"/>
