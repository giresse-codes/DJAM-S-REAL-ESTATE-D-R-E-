const eo=x=>1-Math.pow(1-x,4), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

  el.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;

function life(t,a,b,ai=.5,bo=.4){return {i:eo(p(t,a,a+ai)),o:ei(p(t,b-bo,b)),on:t>a-.01&&t<b+.01}}
function std(el,t,a,b,{x=0,y=0,dy=40,s0=.94,bl0=10,dyo=-30,so=1,rz=0}={}){const L=life(t,a,b);

 <div style="position:absolute;left:260px;top:186px"><div class="big" style="font-size:52px;color:#0b2a66;letter-spacing:-1px">Terrain Missolé 2</div><div style="font-size:24px;color:#6b7a93;font-weight:600;margin-top:8px">14 ha · Dibamba · Façade sur la Nationale</div></div>
