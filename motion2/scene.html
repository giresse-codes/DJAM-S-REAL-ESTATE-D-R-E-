<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DRE Motion v2</title>
<style>
@font-face{font-family:M;src:url(assets/montserrat-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:M;src:url(assets/montserrat-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:M;src:url(assets/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:P;src:url(assets/playfair-display-latin-700-italic.woff2);font-weight:700;font-style:italic}
:root{--cyan:#4cc3ff;--blue:#1f7fe0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#02050c;font-family:M,sans-serif;color:#fff}
#world{position:absolute;inset:0;overflow:hidden;perspective:1800px}
.abs{position:absolute;left:50%;top:50%;will-change:transform,opacity,filter}
.blob{position:absolute;border-radius:50%;left:0;top:0}
.full{position:absolute;inset:0}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.28);box-shadow:0 0 40px rgba(76,195,255,.25),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(18px)}
.label{font-size:30px;letter-spacing:12px;font-weight:600;color:var(--cyan);white-space:nowrap}
.big{font-weight:800;white-space:nowrap;letter-spacing:-3px;line-height:1}
.ser{font-family:P;font-style:italic;font-weight:700}
.gr{background:linear-gradient(90deg,#c6eeff,#4cc3ff 45%,#1f7fe0);-webkit-background-clip:text;background-clip:text;color:transparent}
canvas.foot{position:absolute;left:0;top:0}
/* cards */
.qcard{width:400px;height:300px;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-size:44px;font-weight:800}
.ico{width:120px;height:120px;border-radius:32px;background:linear-gradient(135deg,#4cc3ff,#1f5fd0);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(76,195,255,.6)}
.ico svg{width:66px;height:66px}
.chip{padding:20px 36px;border-radius:24px;font-size:40px;font-weight:600;white-space:nowrap}
.svc{width:540px;height:640px;border-radius:40px;overflow:hidden}
.svc .media{position:absolute;left:0;top:0;width:540px;height:380px;overflow:hidden}
.svc .media canvas{position:absolute;left:-60px;top:0;width:660px;height:380px}
.svc .media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,8,24,0) 50%,rgba(6,18,46,.95))}
.svc .txt{position:absolute;left:44px;right:40px;top:400px}
.svc .n{font-size:24px;letter-spacing:6px;opacity:.6;font-weight:600}
.svc h3{margin-top:12px;font-size:50px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.svc p{margin-top:14px;font-size:28px;opacity:.8}
#notif{width:980px;height:190px;border-radius:44px;display:flex;align-items:center;gap:34px;padding:0 40px}
#notif .ap{width:120px;height:120px;border-radius:30px;background:#06122e;border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
#notif .ap img{width:100px}
#notif .t1{font-size:26px;opacity:.7;font-weight:600;letter-spacing:2px}
#notif .t2{font-size:42px;font-weight:800;margin-top:6px}
.ccard{width:640px;border-radius:40px;padding:36px 40px}
.ccard .hd{display:flex;align-items:center;gap:24px;font-size:36px;font-weight:800}
.ccard .bub{margin-top:28px;padding:22px 28px;border-radius:26px 26px 26px 8px;background:rgba(255,255,255,.14);font-size:30px;display:inline-block}
.ccard .me{margin-top:18px;padding:22px 28px;border-radius:26px 26px 8px 26px;background:linear-gradient(135deg,#25b860,#14874a);font-size:30px;display:inline-block;float:right}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;margin:0 5px}
#num{font-size:124px;font-weight:800;letter-spacing:2px;white-space:nowrap;display:flex;gap:30px;transform:translate(-50%,-50%)}
#num span{display:inline-block}
#btn{padding:32px 70px;border-radius:30px;background:#fff;color:#0a2a66;font-size:46px;font-weight:800;white-space:nowrap;box-shadow:0 0 60px rgba(76,195,255,.8)}
#logo{width:760px}
#tel{display:flex;align-items:center;gap:26px;padding:20px 44px 20px 22px;border-radius:999px;white-space:nowrap}
.phi{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#4cc3ff,#1f6fe0);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(76,195,255,.8)}
#tel .num2{font-size:52px;font-weight:800;letter-spacing:1px}
#tel .lab{font-size:21px;letter-spacing:5px;opacity:.75;font-weight:600;display:block}
.react{width:150px;height:150px}
.react img{width:100%;height:100%;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:5px solid #9fe0ff}
.p{position:absolute;left:0;top:0;border-radius:50%}
/* subtitles */
#subs{position:absolute;left:0;right:0;top:948px;text-align:center;font-weight:800;font-size:54px;letter-spacing:-.5px;white-space:nowrap}
#subs span{display:inline-block;margin:0 .2em;text-shadow:0 4px 18px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.72) 100%)}
#subshade{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55))}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(190,235,255,.95),rgba(31,127,224,0) 65%);opacity:0}
#black{position:absolute;inset:0;background:#000;opacity:0}
</style>
</head>
<body>
<div id="world">
  <div id="bg" class="full"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
  <div id="scenes" class="full"></div>
  <div id="particles" class="full"></div>
  <div id="flash"></div>
</div>
<div id="black"></div>
<div id="vig"></div>
<div id="subshade"></div>
<div id="reacts" class="full"></div>
<div id="subs"></div>
<script src="words.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,4), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=2.2;return x<=0?0:1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const W=window.WORDS, ws=i=>W[i][1];
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
function set(el,{x=0,y=0,s=1,rx=0,ry=0,rz=0,z=0,o=1,bl=0,sx=1}){
  el.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s*sx},${s})`;
  el.style.opacity=o; el.style.filter=bl>0.05?`blur(${bl}px)`:'none'; el.style.visibility=o<=0.002?'hidden':'visible';
}
// pop-in/out helper for an element living [a,b]
function life(t,a,b,ai=.55,bo=.45){return {i:eo(p(t,a,a+ai)),o:ei(p(t,b-bo,b)),on:t>a-.01&&t<b+.01}}
function std(el,t,a,b,{x=0,y=0,dy=70,s0=.85,bl0=16,dyo=-40,so=1}={}){const L=life(t,a,b);
  set(el,{x,y:y+(1-L.i)*dy+L.o*dyo,s:lerp(s0,1,L.i)*lerp(1,so,L.o),o:L.on?L.i*(1-L.o):0,bl:(1-L.i)*bl0+L.o*bl0});return L}
const H=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;$('scenes').appendChild(e);return e};
const ICON={
 land:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18l6-8 4 5 3-3 7 6z"/><circle cx="17" cy="6" r="2"/></svg>',
 bld:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/></svg>',
 house:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>',
 key:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>',
 phone:'<svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
 chat:'<svg width="44" height="44" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm4.6 13.4c-.2.6-1.2 1.2-1.7 1.2-.4.1-1 .1-1.6-.1-.4-.1-.9-.3-1.5-.6-2.6-1.1-4.3-3.8-4.4-4-.1-.2-1-1.4-1-2.6s.6-1.8.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>'
};

/* ================= footage (pre-extracted frames drawn to canvas) ================= */
const CLIPS={intro:144,bati:102,nonbati:102,cta:150}, IMG={};
const loads=[];
for(const [k,n] of Object.entries(CLIPS)){IMG[k]=[];for(let i=1;i<=n;i++){const im=new Image();im.src=`assets/clips/${k}/${String(i).padStart(3,'0')}.jpg`;IMG[k].push(im);loads.push(im.decode().catch(()=>{}))}}
function drawClip(cv,k,lt,{zoom=1,px=0,py=0}={}){const a=IMG[k];const im=a[cl(Math.floor(lt*30),0,a.length-1)];const c=cv.getContext('2d');
  const w=cv.width,h=cv.height;const s=Math.max(w/1280,h/720)*zoom;const dw=1280*s,dh=720*s;c.drawImage(im,(w-dw)/2+px,(h-dh)/2+py,dw,dh)}
function mkCanvas(parent,w,h,cls='foot'){const c=document.createElement('canvas');c.width=w;c.height=h;c.className=cls;parent.appendChild(c);return c}

/* ================= scene 0 : terrain + logo rising from the ground ================= */
const s0=H('<div class="full" id="s0"></div>');
const cv0=mkCanvas(s0,1920,1080);
const s0tint=H('<div class="full" style="background:linear-gradient(180deg,rgba(2,8,30,.55),rgba(2,8,30,.1) 40%,rgba(2,6,18,.85))"></div>'); s0.appendChild(s0tint);
const hole=document.createElement('div');hole.className='abs';hole.style.cssText='width:1200px;height:260px;border-radius:50%;background:radial-gradient(ellipse,rgba(120,210,255,.75),rgba(31,127,224,.25) 40%,rgba(0,0,0,0) 70%)';s0.appendChild(hole);
const crack=document.createElementNS('http://www.w3.org/2000/svg','svg');crack.setAttribute('viewBox','0 0 1920 1080');crack.setAttribute('class','full');
{const r=rnd(11);let d='';for(let k=0;k<9;k++){let x=960,y=690;const dir=k<4?-1:k<8?1:0;d+=`M${x} ${y}`;for(let j=0;j<7;j++){x+=dir*(40+r()*70)+(dir?0:(r()-.5)*40);y+=(r()-.5)*40+(dir?0:16);d+=` L${x.toFixed(0)} ${y.toFixed(0)}`}}
 crack.innerHTML=`<defs><filter id="cg"><feGaussianBlur stdDeviation="5"/></filter></defs><path d="${d}" fill="none" stroke="#7fd6ff" stroke-width="9" filter="url(#cg)"/><path d="${d}" fill="none" stroke="#e8f8ff" stroke-width="3"/>`}
s0.appendChild(crack); const crackPaths=crack.querySelectorAll('path'); crackPaths.forEach(pa=>{const L=pa.getTotalLength();pa.style.strokeDasharray=L;pa.dataset.L=L});
const mask=document.createElement('div');mask.style.cssText='position:absolute;left:0;top:0;width:1920px;height:700px;overflow:hidden';s0.appendChild(mask);
const logo0=document.createElement('img');logo0.src='assets/logo-dark.png';logo0.className='abs';logo0.style.cssText='width:600px;top:380px';mask.appendChild(logo0);
// dirt particles
const dirt=[];{const r=rnd(5);for(let i=0;i<90;i++){const e=document.createElement('div');e.className='p';const sz=4+r()*14;e.style.width=e.style.height=sz+'px';
  const c=r()<.7?`rgb(${150+r()*50|0},${85+r()*40|0},${45+r()*25|0})`:'rgb(170,225,255)';e.style.background=c;$('particles').appendChild(e);
  dirt.push({e,vx:(r()-.5)*900,vy:-(400+r()*900),t0:1.25+r()*1.4,x0:960+(r()-.5)*500,sz})}}

/* ================= scene 1 : questions ================= */
const s1lab=H('<div class="abs label">VOUS RECHERCHEZ</div>');
const q=[['land','Un terrain'],['bld','Un logement'],['house','Une maison']].map(([i,tx])=>H(`<div class="abs glass qcard"><div class="ico">${ICON[i]}</div>${tx}</div>`));
const s1b=H('<div class="abs label">OU ALORS VOUS VOULEZ</div>');
const vendre=H('<div class="abs big" style="font-size:230px"><span class="gr">VENDRE</span></div>');
const sign=H(`<div class="abs" style="width:300px;height:330px"><svg viewBox="0 0 300 330" width="300" height="330"><rect x="140" y="110" width="20" height="220" fill="#c9d6e8"/><rect x="10" y="20" width="280" height="150" rx="18" fill="#1f7fe0" stroke="#fff" stroke-width="6"/><text x="150" y="85" text-anchor="middle" font-family="M" font-weight="800" font-size="44" fill="#fff">À VENDRE</text><text x="150" y="135" text-anchor="middle" font-family="M" font-weight="600" font-size="26" fill="#cfefff">D.R.E</text></svg></div>`);
const ch1=H('<div class="abs glass chip">Votre terrain</div>'), ch2=H('<div class="abs glass chip">Votre domicile</div>');

/* ================= scene 2 : problem ================= */
const prob=H('<div class="abs" style="width:1600px;height:260px"></div>');
['#ff3b5c','#4cc3ff','#fff'].forEach(c=>{const d=document.createElement('div');d.className='big';d.style.cssText=`position:absolute;left:0;right:0;top:0;text-align:center;font-size:190px;color:${c};mix-blend-mode:${c=='#fff'?'normal':'screen'}`;d.textContent='UN PROBLÈME';prob.appendChild(d)});
const probSub=H('<div class="abs ser" style="font-size:80px;white-space:nowrap;color:#ffd0d8">aussi fâcheux…</div>');
const ou=H('<div class="abs big" style="font-size:250px">OÙ<span style="color:#ff5a74">?</span></div>');
const qui=H('<div class="abs big" style="font-size:250px">QUI<span style="color:#ff5a74">?</span></div>');
const cont=H('<div class="abs label" style="color:#fff;font-size:40px">CONTACTER</div>');
const qms=[];{const r=rnd(3);for(let i=0;i<14;i++){const e=H(`<div class="abs big" style="font-size:${60+r()*90|0}px;color:rgba(255,255,255,.18)">?</div>`);qms.push({e,x:(r()-.5)*1700,y:(r()-.5)*800,ph:r()*6})}}
const blink=H('<div class="abs" style="width:18px;height:18px;border-radius:50%;background:#9fe0ff;box-shadow:0 0 30px #4cc3ff"></div>');

/* ================= scene 3 : good news / solution ================= */
const bonne=H('<div class="abs big" style="font-size:190px;text-align:center"><span class="gr">BONNE</span><br><span>NOUVELLE</span></div>');
const notif=H(`<div class="abs glass" id="notif"><div class="ap"><img src="assets/house-dark.png"></div><div><div class="t1">DJAM'S REAL ESTATE · MAINTENANT</div><div class="t2">Nous ne sommes pas venus seuls…</div></div></div>`);
const sol=H('<div class="abs big" style="font-size:170px;text-align:center"><span class="ser" style="font-size:100px;letter-spacing:0;font-weight:700">avec</span><br><span class="gr">LA SOLUTION</span></div>');
const check=H('<div class="abs" style="width:260px;height:260px"><svg viewBox="0 0 100 100" width="260" height="260"><defs><filter id="ck"><feGaussianBlur stdDeviation="3"/></filter></defs><circle cx="50" cy="50" r="44" fill="none" stroke="#4cc3ff" stroke-width="5" opacity=".5"/><path id="ckp" d="M28 52 L44 67 L74 34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>');
const ckp=check.querySelector('#ckp'); ckp.style.strokeDasharray=80;

/* ================= scene 4 : services ================= */
const svcLab=H('<div class="abs label">NOS SERVICES</div>');
const SV=[['bati','01','Terrains bâtis','Maisons & constructions'],['nonbati','02','Terrains non bâtis','Parcelles prêtes à bâtir'],[null,'03','Gestion de biens immobiliers','Nous gérons pour vous']].map(([clip,n,h,tx])=>{
  const e=H(`<div class="abs glass svc"><div class="media"></div><div class="txt"><div class="n">${n}</div><h3>${h}</h3><p>${tx}</p></div></div>`);
  const m=e.querySelector('.media');let cv=null;
  if(clip){cv=mkCanvas(m,660,380,'');}
  else m.innerHTML=`<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#2a8cf0,#071a44 70%)"></div><div class="ico" style="position:absolute;left:210px;top:60px">${ICON.key}</div>
   <div style="position:absolute;left:70px;right:70px;top:220px">${['Loyers','Entretien','Suivi'].map((x,i)=>`<div style="display:flex;align-items:center;gap:14px;margin-top:12px;font-size:24px;font-weight:600"><span style="width:28px;height:28px;border-radius:8px;background:#4cc3ff;display:inline-flex;align-items:center;justify-content:center;font-size:20px">✓</span>${x}<span class="bar" style="flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.2);position:relative;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;width:0;background:#9fe0ff;border-radius:5px"></i></span></div>`).join('')}</div>`;
  return {e,cv,clip}});

/* ================= scene 5 : contact ================= */
const how=H('<div class="abs big" style="font-size:150px;text-align:center">COMMENT NOUS<br><span class="gr">CONTACTER ?</span></div>');
const simple=H('<div class="abs ser" style="font-size:150px;white-space:nowrap">C\'est simple.</div>');
const wa=H(`<div class="abs glass ccard"><div class="hd"><div class="phi" style="background:linear-gradient(135deg,#3ddc84,#14874a);box-shadow:0 0 30px rgba(61,220,132,.7)">${ICON.chat}</div>WhatsApp</div><div class="bub" id="wab">Bonjour 👋 Djam's Real Estate, comment pouvons-nous vous aider ?</div><div class="me" id="wame">Je veux réserver un terrain&nbsp;!</div><div style="clear:both"></div></div>`);
const call=H(`<div class="abs glass ccard" style="width:520px;text-align:center"><div style="position:relative;width:170px;height:170px;margin:10px auto 20px"><div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="phi" style="position:absolute;left:25px;top:25px;width:120px;height:120px">${ICON.phone}</div></div><div style="font-size:40px;font-weight:800">Appel direct</div><div style="font-size:26px;opacity:.7;margin-top:8px;font-weight:600">Appel en cours…</div></div>`);
const num=H('<div class="abs" id="num"><span>(+237)</span><span class="gr">690</span><span>54 61</span><span class="gr">11</span></div>');
const numLab=H('<div class="abs label">WHATSAPP · APPEL DIRECT</div>');

/* ================= scene 6 : CTA over terrain ================= */
const s6=H('<div class="full" id="s6"></div>'); const cv6=mkCanvas(s6,1920,1080);
s6.appendChild(Object.assign(document.createElement('div'),{className:'full',style:'background:linear-gradient(90deg,rgba(3,12,40,.9),rgba(3,12,40,.35) 60%,rgba(3,12,40,.15)),linear-gradient(180deg,rgba(0,0,0,0) 60%,rgba(0,0,0,.6))'}));
const att=H('<div class="abs label" style="font-size:36px">N\'ATTENDEZ PLUS</div>');
const res=H('<div class="abs big" style="font-size:124px;text-align:left;line-height:1.02">RÉSERVEZ<br>VOTRE <span class="gr">TERRAIN</span></div>');
const btn=H('<div class="abs" id="btn">Dès maintenant →</div>');
const pin=H('<div class="abs" style="width:150px;height:150px"><img src="assets/emoji/1f4cd.svg" style="width:150px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.6))"></div>');
