function pop(el,t,a,b,{x=0,y=0,rz=0,s=1}={}){const L=life(t,a,b,.45,.35);set(el,{x,y:y+L.o*-30,s:s*cl(back(p(t,a,a+.45)),0,2)*(1-L.o*.1),rz,o:L.on?cl(p(t,a,a+.12))*(1-L.o):0,bl:L.o*10});return L}
